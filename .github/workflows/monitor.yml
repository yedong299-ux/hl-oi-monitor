name: Hyperliquid OI Monitor

on:
  schedule:
    # 每5分钟跑一次（GitHub Actions 的定时任务在高峰期可能有几分钟延迟，属正常现象）
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # 允许在 Actions 页面手动点一下测试

permissions:
  contents: write  # 需要写权限才能把 state.json 提交回仓库

jobs:
  check-oi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: 运行监控脚本
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          OI_CHANGE_THRESHOLD: "2"
          # 如果只想盯自己持仓的币种，取消下面一行的注释并改成你的列表
          # OI_WATCHLIST: "B2,MMT,STRK,AR,MARSCOIN,ARK,VTHO,USELESS"
        run: python monitor.py

      - name: 保存最新快照
        run: |
          git config user.name "oi-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update OI snapshot"
          git push
